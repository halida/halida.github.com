# Extra rules for this project on top of the git-leaks defaults.
#
#   git-leaks git . --config .gitleaks.toml
#
# The defaults already cover GitHub tokens, private keys, generic API keys
# and so on. These entries pin down the two credential shapes this repo
# actually uses, so a leaked value cannot slip through under a generic rule.

title = "blog secrets"

[extend]
useDefault = true

[[rules]]
id = "disqus-api-key"
description = "Disqus API key"
regex = '''(?i)disqus[_-]?api[_-]?key\s*[=:]\s*["']?[a-z0-9]{32,}'''
keywords = ["disqus"]

# Note: the Giscus repository and category ids are *not* secrets — they are
# public identifiers that appear in every page's <script> tag. They are kept
# in .env for tidiness, but flagging them would only produce noise.

[[rules]]
id = "github-discussion-token"
description = "GitHub token used for the Discussions import"
regex = '''(?i)github[_-]?token\s*[=:]\s*["']?(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})'''
keywords = ["github_token", "githubToken", "ghp_", "github_pat_"]
